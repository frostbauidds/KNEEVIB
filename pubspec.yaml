name: kneevib
description: KneeVib – Phone companion for the knee wearable monitor.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # BLE
  flutter_blue_plus: ^1.31.0

  # HTTP (Wi-Fi sync)
  dio: ^5.7.0

  # Database
  drift: ^2.35.0
  drift_flutter: ^0.3.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.3
  path: ^1.9.0

  # State management & DI
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # Charts
  fl_chart: ^0.68.0

  # Permissions
  permission_handler: ^11.3.1

  # Export / share
  share_plus: ^10.0.0
  archive: ^3.6.1

  # Preferences
  shared_preferences: ^2.3.2

  # FFT for band-pass filter
  fftea: ^1.3.0

  # Mock HTTP server (demo mode)
  shelf: ^1.4.2
  shelf_router: ^1.1.4

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  equatable: ^2.0.5
  collection: ^1.18.0
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Code generation — Drift schema only
  drift_dev: ^2.35.0
  build_runner: ^2.16.1
  flutter_lints: ^4.0.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/scoring_config.json
    - assets/mock/
